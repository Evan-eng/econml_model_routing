[project]
name = "econml-model-routing"
version = "0.1.0"
description = "Controlled post-training capability-mixture experiment"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate==1.8.1",
  "bitsandbytes==0.46.1; platform_machine == 'x86_64' and sys_platform == 'linux'",
  "datasets==3.6.0",
  "huggingface-hub==0.33.4",
  "matplotlib==3.10.3",
  "numpy==2.2.6",
  "peft==0.16.0",
  "scipy==1.15.3",
  "torch==2.7.1",
  "transformers==4.53.2",
]

[project.optional-dependencies]
robustness = ["lm-eval[hf,math]==0.4.10"]

[dependency-groups]
dev = [
  "pyright==1.1.403",
  "pytest==8.4.1",
  "ruff==0.12.4",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = false
include = [
  "capability_mixture_experiment.py",
  "code_sandbox.py",
  "cluster_contract.py",
  "cluster_pipeline.py",
  "run_benchmark_robustness.py",
  "tests",
]

[tool.pytest.ini_options]
pythonpath = ["."]
